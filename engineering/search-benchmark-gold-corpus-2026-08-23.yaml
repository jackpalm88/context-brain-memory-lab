# Grounded entirely in real records from the canonical workspace as of
# 2026-08-23 -- no synthetic titles. `expected_top` / `acceptable_alternates`
# reference real decision_id / content_id values. NEGATIVE-category queries
# are the only intentionally invented text (must match nothing, by design).
#
# CORPUS SNAPSHOT PIN (freeze-benchmark-state, e7f9b6a6):
#   snapshot_at: 2026-08-23T13:00:00Z
#   workspace_id: 69984891-9fd4-4a39-b3e8-c1f0459c9087
#   All expected_top/acceptable_alternates below are correct AS OF this
#   snapshot. OpenCB keeps growing; a scoring run must use a frozen read-only
#   copy/export of at least the referenced ids (title/reason/context/tags/
#   status/supersession columns) taken at or after this timestamp, NOT a live
#   query against a database that may have since grown new, better-matching
#   records for the same query text. If the live DB has diverged from this
#   pin when a scoring run happens, re-validate expected_top against the pin
#   snapshot, not current live state, or the "correct top-5" will silently
#   drift as unrelated content accumulates.
#
# category values:
#   exact_id, exact_title, boundary, reordered_terms, lv_morphology,
#   diacritics_unaccent, punctuation_hyphen, typo, mixed_language, paraphrase,
#   current_state_supersession, negative, precision_stress, cross_type,
#   multi_match, ranking_precision, isolation
#
# current_state_expectation values:
#   n/a                 -- query has no supersession angle
#   undefined_by_design -- deliberately unresolved; candidate systems must
#                          state their policy explicitly, not silently pick one
#   must_prefer_active   -- if a superseded and its successor are both
#                          plausible hits, the active one must outrank it
#
# false_positives: ids or descriptions of results that would be WRONG to
# surface as a top hit for this query, even if lexically tempting.

