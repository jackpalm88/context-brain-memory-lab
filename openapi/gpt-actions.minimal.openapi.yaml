openapi: "3.1.0"
info:
  title: "OpenCB Memory — GPT Actions (minimal)"
  description: |
    The CURATED MINIMAL action set for custom GPTs: 10 well-described read/answer
    operations. GPT tool selection works best with a small surface — this file is
    deliberately NOT the full OpenCB API (see
    context-brain-actions.public.openapi.yaml for the wider REST surface, and the
    MCP endpoint for all 34 tools).

    Read-only by design: no operation here writes memory. Every operation carries
    x-openai-isConsequential: false so GPT never interrupts for confirmation.

    **Auth:** API Key → Bearer. Header `Authorization: Bearer <token>`
    (the server's MEMORY_LAB_API_TOKEN). `checkMemoryHealth` needs no auth.
  version: "1.0.0"
  contact:
    name: "OpenCB project"

servers:
  - url: "https://api-dev.opencb.xyz"
    description: "OpenCB dev deployment (replace per deployment)"

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string

    CurrencyFields:
      type: object
      description: "Resolver-owned currency: is_current true=current, false=superseded, null=unscoped."
      properties:
        is_current:
          type: boolean
          nullable: true
        current_state_scope:
          type: string
          nullable: true
        cs_supersedes_content_id:
          type: string
          format: uuid
          nullable: true

    DecisionSummary:
      type: object
      properties:
        decision_id:
          type: string
          format: uuid
        title:
          type: string
        decision_status:
          type: string
          enum: [active, superseded, reversed, draft]
        confidence_level:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

paths:
  /health:
    get:
      operationId: checkMemoryHealth
      x-openai-isConsequential: false
      summary: "Is the memory backend reachable?"
      description: "Call first when any action fails unexpectedly — distinguishes backend-down from request errors. Returns service status and version."
      security: []
      responses:
        "200":
          description: "Service status"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string

  /v1/retrieval/search:
    post:
      operationId: retrieveMemoryEvidence
      x-openai-isConsequential: false
      summary: "Retrieve raw ranked evidence for a query"
      description: "Ranked evidence snippets with scores, provenance and currency fields. Use when you need the underlying evidence list; use answerFromMemory when you want a synthesized answer with citations."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: "Free-text retrieval query."
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
      responses:
        "200":
          description: "Ranked evidence envelope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /v1/ask:
    post:
      operationId: answerFromMemory
      x-openai-isConsequential: false
      summary: "Answer a question from workspace memory"
      description: "Deterministic answer grounded ONLY in saved memory, with citations bounded to retrieved evidence. no_context=true is an honest empty (the memory does not know), not an error. Superseded memories are demoted below current ones unless the question is historical."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: "The question to answer from memory."
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
      responses:
        "200":
          description: "Answer envelope with citations and evidence"
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  confidence:
                    type: number
                  no_context:
                    type: boolean
                  citations:
                    type: array
                    items:
                      type: object
                  evidence:
                    type: array
                    items:
                      type: object

  /v1/content/{content_id}:
    get:
      operationId: getContentById
      x-openai-isConsequential: false
      summary: "Fetch one stored content item by id"
      description: "The stored record including currency fields — is_current=false means this item was superseded; follow up with listCurrentStateAnchors on its current_state_scope to find what replaced it."
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Content record"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurrencyFields"
                  - type: object
                    properties:
                      content_id:
                        type: string
                        format: uuid
                      quick_summary:
                        type: string
                        nullable: true
                      tier:
                        type: string
                        nullable: true
        "404":
          description: "Unknown id (or foreign workspace — indistinguishable by design)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/hubs:
    get:
      operationId: listHubs
      x-openai-isConsequential: false
      summary: "List the workspace's topic hubs"
      description: "Entry point for orientation: what topics does this memory cover? NOTE: returns a bare JSON array (legacy shape), not an envelope."
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived]
            default: active
      responses:
        "200":
          description: "Bare array of hubs"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hub_id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    hub_type:
                      type: string
                    description:
                      type: string
                      nullable: true

  /decisions/:
    get:
      operationId: listDecisions
      x-openai-isConsequential: false
      summary: "List tracked decisions"
      description: "Decision nodes with status and confidence, newest first. Filter by status or hub. Use explainDecision for full rationale."
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, superseded, reversed, draft]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Decisions envelope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/DecisionSummary"
                  count:
                    type: integer

  /decisions/{decision_id}:
    get:
      operationId: explainDecision
      x-openai-isConsequential: false
      summary: "Full decision record — what was decided and WHY"
      description: "Rationale, context, why it matters, alternatives considered, contradicting evidence, and the source/canonical content links."
      parameters:
        - name: decision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Full decision"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DecisionSummary"
                  - type: object
                    properties:
                      decision_reason:
                        type: string
                      decision_context:
                        type: string
                        nullable: true
                      why_this_matters:
                        type: string
                        nullable: true
                      source_content_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
        "404":
          description: "Unknown decision id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /decisions/{decision_id}/lineage:
    get:
      operationId: getDecisionLineage
      x-openai-isConsequential: false
      summary: "A decision's supersession chain"
      description: "Ancestors (what this decision replaced) and descendants (what replaced it). Always consult before presenting a decision as final — lineage prevents overreach."
      parameters:
        - name: decision_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Lineage tree"
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision_id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  ancestors:
                    type: array
                    items:
                      type: object
                  descendants:
                    type: array
                    items:
                      type: object
                  depth:
                    type: integer
                  depth_limit_reached:
                    type: boolean

  /v1/current-state/anchors:
    get:
      operationId: listCurrentStateAnchors
      x-openai-isConsequential: false
      summary: "What is CURRENT for a scope right now?"
      description: "The forward pointer of the supersession chain: given a scope (e.g. a superseded item's current_state_scope), returns the active anchor(s) naming what IS current there. Scope is normalized server-side, so raw topic phrases match their stored form. count=0 means an unclaimed scope, not an error."
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: memory_type
          in: query
          required: false
          schema:
            type: string
            enum: [milestone, decision, principle, anchor, evidence, plan_roadmap, raw_memory]
      responses:
        "200":
          description: "Active anchors for the (normalized) scope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  anchors:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
                  scope:
                    type: string
        "422":
          description: "Empty scope or unknown memory_type"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /decisions/by-content/{content_id}:
    get:
      operationId: listDecisionsForContent
      x-openai-isConsequential: false
      summary: "Which decisions reference this content item?"
      description: "The content→decision join: given a content_id from retrieval or ask evidence, returns the decision nodes behind it (link_role: canonical = the decision's own narrative, source = declared supporting evidence). count=0 means an unlinked item, not an error. Follow with explainDecision / getDecisionLineage."
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "Decisions linking the content, newest first"
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/DecisionSummary"
                        - type: object
                          properties:
                            link_role:
                              type: string
                              enum: [canonical, source]
                            also_source:
                              type: boolean
                  count:
                    type: integer
                  content_id:
                    type: string
                    format: uuid
